services:
  landing:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-https://innochipdesign.campus.innopolis.university}
    ports:
      - '80:8080'
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16M,noexec,nosuid,nodev
      - /data:size=16M,noexec,nosuid,nodev
      - /config:size=16M,noexec,nosuid,nodev
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 32M
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
