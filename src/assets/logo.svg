<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="InnoChipDesign">
  <!--
    The club mark, as supplied by the club leader (06-design-system.md §7).

    Geometry is byte-faithful to the original export. The only edits are mechanical: the original
    wrapped everything in a full-canvas alpha mask (a no-op), repeated four rects twice, and
    expressed the six edge bars as rotate(90)/matrix() transforms of off-canvas rects. Those are
    resolved to plain axis-aligned rects here so the file can be inlined, scaled and rasterised
    without a transform-aware renderer — satori, which builds the OG cards, is one such renderer.

    Deliberately NOT currentColor. This is a reversed mark: the green field IS the logo and the
    pattern is the knock-out. Recolouring it to the link accent would produce a shape the club has
    never used. Because it carries its own ground, it needs no dark-mode variant — a saturated
    green square reads correctly on #fff and on #0e1116 alike.
  -->
  <rect width="640" height="640" fill="#40BA21" />
  <g fill="#fff">
    <!-- top edge: three prongs into the frame bar -->
    <rect x="175" y="0" width="58" height="58.908" />
    <rect x="291" y="0" width="58" height="58.908" />
    <rect x="408" y="0" width="58" height="58.908" />
    <rect x="175" y="58.908" width="291" height="57.9095" />
    <!-- left edge -->
    <rect x="0" y="174.727" width="59" height="57.9095" />
    <rect x="0" y="407.364" width="59" height="57.9095" />
    <rect x="59" y="174.727" width="58" height="290.546" />
    <!-- right edge -->
    <rect x="581" y="174.727" width="59" height="57.9095" />
    <rect x="581" y="407.364" width="59" height="57.9095" />
    <rect x="523" y="174.727" width="58" height="290.546" />
    <!-- centre ring and die -->
    <rect x="175" y="174.727" width="291" height="57.9095" />
    <rect x="175" y="232.636" width="58" height="173.729" />
    <rect x="408" y="232.636" width="58" height="173.729" />
    <rect x="175" y="406.365" width="291" height="57.9095" />
    <rect x="291" y="290.546" width="58" height="58.908" />
    <!-- bottom edge and the pin dropping off-canvas -->
    <rect x="175" y="523.183" width="291" height="57.9095" />
    <rect x="408" y="523.183" width="58" height="116.817" />
  </g>
</svg>
