# Controlled tag vocabulary (D25, 02-content-model.md §3).
#
# Seeded from the club's actual repositories, which is why this is a hardware taxonomy and not a
# generic one. A project's `tags` must all appear here or the build fails naming the file.
#
# Keep the list under ~15. If it grows past that the taxonomy is wrong and needs a second
# dimension, not more tags.
#
# `color` maps to a --color-tag-* token pair defined for light AND dark in global.css. An unknown
# colour name falls back to --color-surface-2 rather than throwing: a mistyped colour should not
# break a build that a mistyped *tag* already catches.

- id: fpga
  label: FPGA
  color: blue
  hint: Targeted at an FPGA board. Most club projects.

- id: asic
  label: ASIC
  color: violet
  hint: An ASIC flow — synthesis, place & route, tapeout-oriented.

- id: riscv
  label: RISC-V
  color: teal
  hint: A RISC-V core, or the RISC-V ISA specifically.

- id: cpu
  label: CPU & Microarchitecture
  color: indigo
  hint: Pipelines, hazards, branch prediction, microarchitecture generally.

- id: memory
  label: Memory & Cache
  color: cyan
  hint: Caches, memory controllers, banking, DRAM.

- id: peripherals
  label: Peripherals & Interfaces
  color: sky
  hint: UART, SPI, I²C, VGA/HDMI, USB, GPIO.

- id: dsp
  label: Signal & Audio
  color: amber
  hint: Audio, filters, FFT, signal processing.

- id: vision
  label: Image & Video
  color: rose
  hint: Image or video processing, edge detection, camera pipelines.

- id: verification
  label: Verification
  color: emerald
  hint: Testbenches, UVM, formal, coverage — verification is the point, not a side effect.

- id: games
  label: Games & Demos
  color: fuchsia
  hint: A game or graphical demo is the deliverable.

- id: tools
  label: Tooling & EDA
  color: slate
  hint: Scripts, generators, EDA flows, teaching infrastructure.
